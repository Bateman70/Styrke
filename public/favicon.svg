<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Circular Gradient Badge -->
  <circle cx="256" cy="256" r="256" fill="url(#appGradient)" />
  
  <!-- Dumbbell Icon Rotated 12 Degrees -->
  <g transform="translate(256 256) scale(0.9) rotate(12) translate(-256 -256)">
    <!-- Central Bar -->
    <rect x="150" y="240" width="212" height="32" rx="10" fill="#ffffff" />
    
    <!-- Left Inner Plate -->
    <rect x="180" y="172" width="40" height="168" rx="14" fill="#ffffff" />
    
    <!-- Left Outer Plate -->
    <rect x="140" y="194" width="34" height="124" rx="12" fill="#ffffff" />
    
    <!-- Right Inner Plate -->
    <rect x="292" y="172" width="40" height="168" rx="14" fill="#ffffff" />
    
    <!-- Right Outer Plate -->
    <rect x="338" y="194" width="34" height="124" rx="12" fill="#ffffff" />
  </g>
</svg>
